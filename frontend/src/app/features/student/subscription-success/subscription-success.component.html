<div class="success-wrap">
  <div class="loading-state" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Activando tu suscripción...</p>
  </div>

  <div class="success-state" *ngIf="!isLoading">
    <div class="success-icon">
      <i class="bi bi-patch-check-fill"></i>
    </div>
    <h1>¡Suscripción activada!</h1>
    <p *ngIf="plan">Bienvenido al plan <strong>{{ plan.name }}</strong>. Ya podés empezar a explorar los cursos.</p>
    <p *ngIf="!plan">Tu suscripción fue procesada exitosamente.</p>

    <div class="success-actions">
      <button class="btn-explore" (click)="goToExplore()">
        <i class="bi bi-compass"></i>
        Explorar cursos
      </button>
      <button class="btn-dashboard" (click)="goToDashboard()">
        <i class="bi bi-house-fill"></i>
        Ir al dashboard
      </button>
    </div>
  </div>
</div>
